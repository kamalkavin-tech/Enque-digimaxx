server {
    # Listen on BOTH ports so the container works whatever "Container Port"
    # is set to in the Dokploy domain dialog. 80 is the correct value for an
    # nginx image; 3000 is Dokploy's default (it assumes a Node app) and is a
    # very easy setting to leave untouched. Serving both removes the mismatch
    # as a possible failure mode.
    listen      80;
    listen      3000;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Preserve the public host and mapped port in nginx-generated redirects.
    absolute_redirect off;

    # ---------------------------------------------------------------
    # Path normalisation for  clients.welocalhost.com/bluecolorsite
    #
    # Dokploy/Traefik path routing may or may not strip the prefix
    # before forwarding, depending on whether a StripPrefix middleware
    # is attached. We accept BOTH and normalise to the flat web root,
    # so the container is correct either way:
    #
    #   prefix NOT stripped -> nginx sees /bluecolorsite/assets/x.js
    #   prefix IS  stripped -> nginx sees /assets/x.js
    # ---------------------------------------------------------------
    rewrite ^/bluecolorsite$        /bluecolorsite/          permanent;
    rewrite ^/bluecolorsite/contact$ /bluecolorsite/contact/ permanent;
    rewrite ^/bluecolorsite/(.*)$   /$1              last;

    # container health probe (Dokploy / Docker HEALTHCHECK)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm font/woff font/woff2;

    # Rive WebAssembly — MUST be application/wasm for streaming
    # instantiation, otherwise the runtime falls back to the CDN.
    # Empty `types {}` clears the inherited map so default_type wins.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rive animation binaries
    location ~* \.riv$ {
        types { }
        default_type application/octet-stream;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The upstream template references a removed Semi-Bold filename. Serve
    # the bundled APK Protocol font for that legacy request as well.
    location = /assets/APK-Protocol-Semi-Bold.CC2BASA5.woff2 {
        types { }
        default_type font/woff2;
        try_files /assets/APK-Protocol-Medium.C7Mq9oGh.woff2 =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # content-hashed build output -> safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # never cache the HTML shell, so redeploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # don't leak the nginx version
    server_tokens off;
}
